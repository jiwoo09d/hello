<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다의 기적(奇跡)</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a31eca0579130b2b15ccc5b8fba70f09&libraries=services"></script>
    <style>
        /* 감성적인 새벽 바다 톤의 내비게이션 및 전체 배경 정의 */
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #fcfcfc; color: #333; }
        
        /* 헤더 디자인: 깊은 밤바다 색감과 은은한 여백 */
        header { background: linear-gradient(135deg, #1A252F, #2C3E50); color: white; padding: 25px 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 10; }
        header h1 { margin: 0; font-size: 1.6rem; font-weight: 300; letter-spacing: 2px; }
        header p { margin: 8px 0 0 0; font-size: 0.85rem; color: #bdc3c7; font-style: italic; letter-spacing: 0.5px; }
        
        /* 탭 컨테이너: 차분하고 모던한 플랫 디자인 */
        .tab-container { display: flex; background: #2C3E50; border-bottom: 1px solid #34495E; z-index: 10; }
        .tab-button { flex: 1; padding: 15px; border: none; background: none; color: #95a5a6; font-size: 0.9rem; cursor: pointer; transition: all 0.4s ease; letter-spacing: 1px; }
        .tab-button.active { background: #1A252F; color: #5DADE2; font-weight: bold; border-bottom: 3px solid #5DADE2; }
        .tab-button:hover { color: #fff; }
        
        /* 메인 레이아웃 구성을 위한 구조 정의 */
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* 사이드바: 둥근 모서리와 감성적인 그림자 적용 */
        .sidebar { width: 320px; background: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #eaeaea; box-shadow: 4px 0 15px rgba(0,0,0,0.03); z-index: 5; }
        .list-container { flex: 1; overflow-y: auto; padding: 15px 10px; }
        
        /* 리스트 아이템 카드: 세련된 보더와 부드러운 호버 효과 */
        .list-item { padding: 18px 15px; border-radius: 8px; margin-bottom: 12px; background: #fdfdfd; border: 1px solid #f0f0f0; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 2px 5px rgba(0,0,0,0.01); }
        .list-item:hover { background: #F4F6F7; border-color: #5DADE2; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(93,173,226,0.1); }
        .list-item h3 { margin: 0 0 6px 0; font-size: 0.95rem; font-weight: bold; color: #2C3E50; line-height: 1.4; }
        .list-item p { margin: 0; font-size: 0.78rem; color: #7F8C8D; line-height: 1.3; }
        
        /* 지도 및 로드뷰 영역 */
        .map-wrapper { flex: 1; position: relative; display: flex; flex-direction: column; }
        #map { flex: 1; }
        #roadview { height: 240px; border-top: 4px solid #1A252F; display: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        
        /* 인포윈도우(팝업) 커스텀 스타일링을 위한 래퍼 */
        .custom-popup { padding: 12px; font-family: 'Malgun Gothic', sans-serif; min-width: 220px; border-radius: 4px; }
        .popup-title { font-size: 0.95rem; font-weight: bold; color: #2C3E50; margin-bottom: 6px; }
        .popup-address { font-size: 0.75rem; color: #7F8C8D; margin-bottom: 8px; display: block; line-height: 1.4; }
        .popup-link { display: inline-block; color: #5DADE2; text-decoration: none; font-size: 0.75rem; font-weight: bold; transition: color 0.2s; }
        .popup-link:hover { color: #2C3E50; }
    </style>
</head>
<body>

    <header>
        <h1>『바다의 기적(奇跡)』</h1>
        <p>"우리가 살아 있는 동안에는 어디든 바다가 가깝다." — 숨이 막혀올 때, 무작정 멈춰 선 곳</p>
    </header>

    <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('AT4', this)">🌊 오직 파도 소리만 들리는 바다</button>
        <button class="tab-button" onclick="switchTab('CE7', this)">☕ 테이블 세 개, 작은 안식처</button>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div id="list-container" class="list-container">
                <p style="text-align:center; color:#95a5a6; margin-top:30px; font-size:0.85rem;">가장 가까운 안식처를 연결하는 중...</p>
            </div>
        </div>

        <div class="map-wrapper">
            <div id="map"></div>
            <div id="roadview"></div>
        </div>
    </div>

    <script>
        // 초기 지도 설정 (기본 좌표값 고양시청 근처 기준)
        var mapContainer = document.getElementById('map');
        var mapOption = { center: new kakao.maps.LatLng(37.658359, 126.832020), level: 8 };
        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 로드뷰 및 장소 검색 서비스 객체 정의
        var rvContainer = document.getElementById('roadview');
        var roadview = new kakao.maps.Roadview(rvContainer);
        var roadviewClient = new kakao.maps.RoadviewClient();
        var placeService = new kakao.maps.services.Places();
        
        // 인포윈도우 객체 생성
        var infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        var currentMarkers = []; // 현재 표시된 마커 리스트 배열
        var currentCategory = 'AT4'; // 초기 카테고리값
        var userLocation = new kakao.maps.LatLng(37.658359, 126.832020); // 기본 위치

        // 내 현재 위치 정보 얻어오기
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lon = position.coords.longitude;
                userLocation = new kakao.maps.LatLng(lat, lon);

                // 현재 위치 마커 생성
                var myLocationMarker = new kakao.maps.Marker({
                    map: map,
                    position: userLocation
                });
                
                var myLocationInfo = new kakao.maps.InfoWindow({
                    content: '<div style="padding:6px;font-size:0.75rem;color:#2C3E50;text-align:center;font-weight:bold;">나의 현재 위치</div>'
                });
                myLocationInfo.open(map, myLocationMarker);
                
                map.setCenter(userLocation); 
                searchPlaces(currentCategory); 
            }, function() {
                searchPlaces(currentCategory);
            });
        } else {
            searchPlaces(currentCategory);
        }

        // 탭 선택 제어 함수
        function switchTab(categoryCode, buttonElement) {
            currentCategory = categoryCode;
            
            var buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            removeMarkers();
            infoWindow.close();
            document.getElementById('roadview').style.display = 'none';
            map.relayout();

            searchPlaces(categoryCode);
        }

        // 대량 검색 및 촘촘한 정렬을 위한 로직 변경
        function searchPlaces(categoryCode) {
            // 카카오 내부 필터링에 걸리지 않도록 범용성 높은 최적화 키워드로 변경
            // AT4 카테고리 안에서 '해수욕장'을 검색하면 전국의 해변이 다 걸려옵니다.
            var searchKeyword = categoryCode === 'AT4' ? '해수욕장' : '까페';

            var searchOptions = {
                location: userLocation,
                size: 15, // 한 번에 가져올 수 있는 카카오 API의 최댓값 설정
                sort: kakao.maps.services.SortBy.DISTANCE // 무조건 가까운 순 정렬
            };

            placeService.keywordSearch(searchKeyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    displayResults(data);
                } else {
                    document.getElementById('list-container').innerHTML = '<p style="text-align:center; color:#95a5a6; margin-top:30px; font-size:0.85rem;">안식처를 불러오는 데 실패했습니다.</p>';
                }
            }, searchOptions);
        }

        // 결과 화면 표시 및 디자인 렌더링
        function displayResults(places) {
            var listContainer = document.getElementById('list-container');
            listContainer.innerHTML = ''; 
            
            var mapBounds = new kakao.maps.LatLngBounds();

            places.forEach(function(place) {
                var placePosition = new kakao.maps.LatLng(place.y, place.x);
                mapBounds.extend(placePosition);

                var marker = new kakao.maps.Marker({
                    map: map,
                    position: placePosition
                });
                currentMarkers.push(marker);

                var listItem = document.createElement('div');
                listItem.className = 'list-item';
                listItem.innerHTML = '<h3>' + place.place_name + '</h3><p>' + (place.road_address_name || place.address_name) + '</p>';
                listContainer.appendChild(listItem);

                function selectPlaceAction() {
                    var popupContent = '<div class="custom-popup">' +
                                       '<div class="popup-title">' + place.place_name + '</div>' +
                                       '<span class="popup-address">' + (place.road_address_name || place.address_name) + '</span>' +
                                       '<a href="' + place.place_url + '" target="_blank" class="popup-link">카카오맵 상세 정보 보기 →</a>' +
                                       '</div>';
                    infoWindow.setContent(popupContent);
                    infoWindow.open(map, marker);
                    map.panTo(placePosition); 

                    roadviewClient.getNearestPanoId(placePosition, 50, function(panoId) {
                        if (panoId) {
                            document.getElementById('roadview').style.display = 'block';
                            map.relayout();
                            roadview.setPanoId(panoId, placePosition);
                        } else {
                            document.getElementById('roadview').style.display = 'none';
                            map.relayout();
                        }
                    });
                }

                kakao.maps.event.addListener(marker, 'click', selectPlaceAction);
                listItem.addEventListener('click', selectPlaceAction);
            });

            map.setBounds(mapBounds);
        }

        function removeMarkers() {
            currentMarkers.forEach(function(marker) {
                marker.setMap(null);
            });
            currentMarkers = [];
        }
    </script>
</body>
</html>
